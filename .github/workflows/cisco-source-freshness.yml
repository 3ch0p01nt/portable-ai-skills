name: Cisco source freshness

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check sources strictly
        run: >-
          python skills/cisco-device-compromise-investigation/scripts/check_sources.py
          --strict
          --output source-status.json
      - name: Upload source status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cisco-source-status
          path: source-status.json
          if-no-files-found: error
          retention-days: 30
